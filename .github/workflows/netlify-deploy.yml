# Build Flutter web e pubblica su Netlify ad ogni push su main.
# Secrets in GitHub (repo → Settings → Secrets → Actions):
#   NETLIFY_AUTH_TOKEN  — Netlify → User settings → Applications
#   NETLIFY_SITE_ID     — Netlify → Site details → API ID
name: Deploy Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout backoffice_admin_app
        uses: actions/checkout@v4

      - name: Checkout credit_calc_core (credit-calc-store)
        uses: actions/checkout@v4
        with:
          repository: Marcellodinapoli/credit-calc-store
          path: ../creditplanet
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build web
        run: |
          flutter config --enable-web --no-analytics
          flutter pub get
          cd ../creditplanet/packages/credit_calc_core
          flutter pub get
          cd -
          flutter build web --release --no-wasm-dry-run
          test -f build/web/index.html

      - name: Install Netlify CLI
        run: npm install -g netlify-cli@latest

      - name: Deploy to Netlify
        run: netlify deploy --prod --dir=build/web --site=${{ secrets.NETLIFY_SITE_ID }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
