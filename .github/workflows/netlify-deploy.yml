# Build Flutter web e pubblica su Netlify ad ogni push su main.
# Secrets in GitHub (repo → Settings → Secrets → Actions):
#   NETLIFY_AUTH_TOKEN  — Netlify → User settings → Applications
#   NETLIFY_SITE_ID     — Netlify → Site details → API ID
name: Deploy Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout backoffice_admin_app
        uses: actions/checkout@v4
        with:
          path: app

      - name: Checkout credit_calc_core (credit-calc-store)
        uses: actions/checkout@v4
        with:
          repository: Marcellodinapoli/credit-calc-store
          path: creditplanet
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build web
        run: |
          flutter config --enable-web --no-analytics
          flutter pub get
          cd ../creditplanet/packages/credit_calc_core
          flutter pub get
          cd "$GITHUB_WORKSPACE/app"
          flutter build web --release --no-wasm-dry-run
          test -f build/web/index.html

      - name: Install Netlify CLI
        run: npm install -g netlify-cli@latest

      - name: Verifica secrets Netlify
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::error::NETLIFY_AUTH_TOKEN mancante. GitHub → Settings → Secrets and variables → Actions"
            exit 1
          fi
          if [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::error::NETLIFY_SITE_ID mancante. GitHub → Settings → Secrets and variables → Actions"
            exit 1
          fi

      - name: Deploy to Netlify
        run: netlify deploy --prod --dir=build/web --auth="$NETLIFY_AUTH_TOKEN" --site="$NETLIFY_SITE_ID"
