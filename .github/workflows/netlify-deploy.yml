# Build Flutter web e pubblica su Netlify ad ogni push su main.
# Secrets in GitHub (repo → Settings → Secrets → Actions):
#   NETLIFY_AUTH_TOKEN  — Netlify → User settings → Applications
#   NETLIFY_SITE_ID     — Netlify → Site details → API ID
#   OUTFIT_FIREBASE_API_KEY
#   OUTFIT_FIREBASE_APP_ID
#   OUTFIT_FIREBASE_MESSAGING_SENDER_ID
name: Deploy Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      OUTFIT_FIREBASE_API_KEY: ${{ secrets.OUTFIT_FIREBASE_API_KEY }}
      OUTFIT_FIREBASE_APP_ID: ${{ secrets.OUTFIT_FIREBASE_APP_ID }}
      OUTFIT_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.OUTFIT_FIREBASE_MESSAGING_SENDER_ID }}
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout backoffice_admin_app
        uses: actions/checkout@v4
        with:
          path: app

      - name: Checkout credit_calc_core (credit-calc-store)
        uses: actions/checkout@v4
        with:
          repository: Marcellodinapoli/credit-calc-store
          path: creditplanet
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build web
        run: |
          test -n "$OUTFIT_FIREBASE_API_KEY"
          test -n "$OUTFIT_FIREBASE_APP_ID"
          test -n "$OUTFIT_FIREBASE_MESSAGING_SENDER_ID"
          flutter config --enable-web --no-analytics
          flutter pub get
          cd ../creditplanet/packages/credit_calc_core
          flutter pub get
          cd "$GITHUB_WORKSPACE/app"
          flutter build web --release --no-wasm-dry-run \
            "--dart-define=OUTFIT_FIREBASE_API_KEY=$OUTFIT_FIREBASE_API_KEY" \
            "--dart-define=OUTFIT_FIREBASE_APP_ID=$OUTFIT_FIREBASE_APP_ID" \
            "--dart-define=OUTFIT_FIREBASE_MESSAGING_SENDER_ID=$OUTFIT_FIREBASE_MESSAGING_SENDER_ID"
          test -f build/web/index.html

      - name: Install Netlify CLI
        if: ${{ secrets.NETLIFY_AUTH_TOKEN != '' && secrets.NETLIFY_SITE_ID != '' }}
        run: npm install -g netlify-cli@latest

      - name: Deploy to Netlify
        if: ${{ secrets.NETLIFY_AUTH_TOKEN != '' && secrets.NETLIFY_SITE_ID != '' }}
        run: netlify deploy --prod --dir=build/web --auth="$NETLIFY_AUTH_TOKEN" --site="$NETLIFY_SITE_ID"

      - name: Deploy Netlify saltato (secrets mancanti)
        if: ${{ secrets.NETLIFY_AUTH_TOKEN == '' || secrets.NETLIFY_SITE_ID == '' }}
        run: |
          echo "::warning::Deploy Netlify saltato."
          echo "Aggiungi NETLIFY_AUTH_TOKEN e NETLIFY_SITE_ID in:"
          echo "GitHub → Settings → Secrets and variables → Actions"
